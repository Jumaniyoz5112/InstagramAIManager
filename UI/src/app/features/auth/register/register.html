<form class="card" [formGroup]="form" (ngSubmit)="submit()">
  <p class="eyebrow">Instagram AI Manager</p>
  <h1>Ro‘yxatdan o‘tish</h1>
  <p class="hint">Yangi tenant va default workspace avtomatik yaratiladi.</p>

  <label>
    To‘liq ism
    <input type="text" formControlName="fullName" autocomplete="name" />
  </label>

  <label>
    Email
    <input type="email" formControlName="email" autocomplete="username" />
  </label>

  <label>
    Parol
    <input type="password" formControlName="password" autocomplete="new-password" />
  </label>

  <label>
    Tenant nomi
    <input type="text" formControlName="tenantName" />
  </label>

  <label>
    Tenant slug
    <input type="text" formControlName="tenantSlug" placeholder="my-company" />
  </label>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <button type="submit" [disabled]="loading()">
    {{ loading() ? 'Kutilmoqda…' : 'Register' }}
  </button>

  <a routerLink="/auth/login">Allaqachon akkaunt bormi? Kirish</a>
</form>
