# Production — no insecure defaults

spring.liquibase.drop-first=false

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.refresh-cookie-secure=true

app.bootstrap.enabled=false
app.bootstrap.sync-password=false

app.security.crypto.secret=${IG_TOKEN_ENCRYPTION_KEY}
app.instagram.enabled=${INSTAGRAM_ENABLED:false}
app.instagram.app-id=${INSTAGRAM_APP_ID}
app.instagram.app-secret=${INSTAGRAM_APP_SECRET}
app.instagram.redirect-uri=${INSTAGRAM_REDIRECT_URI}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
