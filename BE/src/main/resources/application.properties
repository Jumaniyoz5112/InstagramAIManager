spring.application.name=instagram-ai-manager

server.port=8080

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/InstagramAIManager}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:0110}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Dev: har start'da schema'ni tozalab Liquibase'ni qayta ishga tushiradi
spring.liquibase.drop-first=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Redis (not used in foundation phase)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

app.ai-service.base-url=${AI_SERVICE_URL:http://localhost:8000}
app.cors.allowed-origins=http://localhost:4200

# JWT — override JWT_SECRET in real environments (min 32 chars)
app.security.jwt.secret=${JWT_SECRET:dev-only-change-me-instagram-ai-manager-jwt-secret-32b}
app.security.jwt.access-token-ttl-minutes=15
app.security.jwt.refresh-token-ttl-days=14
app.security.jwt.refresh-cookie-name=iam_refresh
app.security.jwt.refresh-cookie-path=/api/v1/auth
app.security.jwt.refresh-cookie-secure=false
app.security.jwt.refresh-cookie-same-site=Lax

# Static bootstrap admin (password synced on startup for local/dev)
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:admin@local.dev}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:0110}
app.bootstrap.admin-name=${BOOTSTRAP_ADMIN_NAME:Platform Admin}
  