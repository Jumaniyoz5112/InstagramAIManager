spring.application.name=instagram-ai-manager

server.port=8080

# PostgreSQL (local: InstagramAIManager / password 0110)
spring.datasource.url=jdbc:postgresql://localhost:5432/InstagramAIManager
spring.datasource.username=postgres
spring.datasource.password=0110
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Redis (optional for local; start via infrastructure/docker-compose.yml)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# AI service
app.ai-service.base-url=${AI_SERVICE_URL:http://localhost:8000}

# CORS (Angular dev server)
app.cors.allowed-origins=http://localhost:4200
