spring.application.name=instagram-ai-manager
spring.profiles.default=dev

server.port=8080

# PostgreSQL — override via env in non-dev environments
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/InstagramAIManager}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:0110}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Never wipe schema from the shared base config
spring.liquibase.drop-first=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Redis (not used in foundation phase)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

app.ai-service.enabled=${AI_SERVICE_ENABLED:true}
app.ai-service.base-url=${AI_SERVICE_URL:http://localhost:8000}
app.ai-service.model-name=${AI_MODEL_NAME:qwen2.5vl:7b}
app.ai-service.text-model-name=${AI_TEXT_MODEL_NAME:qwen2.5:7b}
app.ai-service.prompt-version=1.1
app.ai-service.insights-prompt-version=1.2
app.ai-service.scenario-prompt-version=1.4
app.ai-service.insights-top-n=6
app.ai-service.insights-low-n=3
app.ai-service.max-concurrent=1
app.ai-service.queue-batch-size=1
app.ai-service.queue-poll-interval-ms=30000
app.ai-service.connect-timeout-ms=5000
app.ai-service.read-timeout-ms=300000
app.ai-service.engagement-cron=0 0 8,20 * * *
app.ai-service.engagement-zone=Asia/Tashkent
app.ai-service.engagement-media-limit-per-account=100
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# JWT — secret must be supplied by active profile or JWT_SECRET env
app.security.jwt.access-token-ttl-minutes=15
app.security.jwt.refresh-token-ttl-days=14
app.security.jwt.refresh-cookie-name=iam_refresh
app.security.jwt.refresh-cookie-path=/api/v1/auth
app.security.jwt.refresh-cookie-same-site=Lax

# Bootstrap is opt-in via profile (dev/test)
app.bootstrap.enabled=false
app.bootstrap.sync-password=false

# AES-GCM for Instagram tokens (and other secrets at rest)
app.security.crypto.secret=${IG_TOKEN_ENCRYPTION_KEY:}

# Local filesystem storage (MinIO later)
app.storage.local-root=${STORAGE_ROOT:storage}

# Instagram Graph — disabled until Meta App credentials are configured
app.instagram.enabled=${INSTAGRAM_ENABLED:false}
app.instagram.app-id=${INSTAGRAM_APP_ID:}
app.instagram.app-secret=${INSTAGRAM_APP_SECRET:}
# Facebook Login for Business / Unified Login (new Meta apps). Empty = classic Instagram Login.
app.instagram.config-id=${INSTAGRAM_CONFIG_ID:}
app.instagram.redirect-uri=${INSTAGRAM_REDIRECT_URI:http://localhost:8080/api/v1/instagram/oauth/callback}
app.instagram.frontend-success-url=${INSTAGRAM_FRONTEND_SUCCESS_URL:http://localhost:4200/app/instagram}
app.instagram.api-base-url=${INSTAGRAM_API_BASE_URL:https://graph.instagram.com}
app.instagram.authorize-base-url=${INSTAGRAM_AUTHORIZE_BASE_URL:https://api.instagram.com/oauth/authorize}
app.instagram.graph-version=${INSTAGRAM_GRAPH_VERSION:v21.0}
app.instagram.scopes=${INSTAGRAM_SCOPES:instagram_business_basic,instagram_business_manage_insights,instagram_business_manage_comments,instagram_business_content_publish}
app.instagram.oauth-state-ttl-minutes=10
app.instagram.historical-max-pages=50
app.instagram.media-url-ttl-hours=48
app.instagram.token-refresh-lead-days=10
app.instagram.incremental-sync-interval-ms=900000
app.instagram.pending-sync-interval-ms=30000
app.instagram.token-refresh-cron=0 30 3 * * *
# Public HTTPS base Meta can GET for staged publish uploads (same tunnel as OAuth redirect host)
app.instagram.public-media-base-url=${INSTAGRAM_PUBLIC_MEDIA_BASE_URL:}
app.instagram.public-media-url-ttl-seconds=7200
app.instagram.publish-poll-interval-ms=3000
app.instagram.publish-poll-max-attempts=60
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB
