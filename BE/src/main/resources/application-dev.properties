# Local / developer profile (spring.profiles.default=dev)

# Preserve existing DB by default. Opt-in wipe: LIQUIBASE_DROP_FIRST=true
spring.liquibase.drop-first=${LIQUIBASE_DROP_FIRST:false}

app.security.jwt.secret=${JWT_SECRET:dev-only-change-me-instagram-ai-manager-jwt-secret-32b}
app.security.jwt.refresh-cookie-secure=false

app.bootstrap.enabled=true
app.bootstrap.sync-password=true
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:admin@local.dev}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:0110}
app.bootstrap.admin-name=${BOOTSTRAP_ADMIN_NAME:Platform Admin}
